<script>
// Получаем модальное окно
var modal = document.getElementById("loginModal");

var span = document.getElementsByClassName("close")[0];
// Получаем кнопку "Войти" по ID
var btn = document.getElementById("loginBtn");

// Когда пользователь нажимает на кнопку "Войти", открываем модальное окно
btn.onclick = function() {
    modal.style.display = "block";
}

span.onclick = function() {
  modal.style.display = "none";
}


// Получаем элементы для обратной связи
var fbModal = document.getElementById("fb");
var fbClose = fbModal.querySelector(".close");
var feedbackBtn = document.querySelector("footer button"); // Кнопка в футере

// Когда пользователь нажимает на кнопку "Обратная связь", открываем модальное окно
feedbackBtn.onclick = function() {
    fbModal.style.display = "block";
}

// Когда пользователь нажимает на крестик, закрываем модальное окно
fbClose.onclick = function() {
    fbModal.style.display = "none";
}

</script>
